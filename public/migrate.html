<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>한맛지 데이터 옮기기</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; color: #222; line-height: 1.6; background: #F8F9FA; }
  h1 { font-size: 22px; }
  label { display: block; font-weight: 600; margin-top: 16px; }
  input { width: 100%; box-sizing: border-box; padding: 8px 10px; border: 1px solid #ccc; border-radius: 6px; font: inherit; }
  button { margin-top: 20px; padding: 10px 18px; border: 0; border-radius: 8px; background: #E8521A; color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  #log { margin-top: 20px; white-space: pre-wrap; background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 12px; min-height: 60px; }
</style>
</head>
<body>
<h1>🍽 Supabase → Cloudflare D1 데이터 옮기기</h1>
<p>Supabase 에 있던 맛집 목록을 새 데이터베이스로 한 번에 옮깁니다.
  새 데이터베이스가 <b>비어 있을 때 한 번만</b> 동작해요.</p>
<ol>
  <li>Supabase 대시보드에서 일시정지된 프로젝트를 <b>Restore(복원)</b> 하고 몇 분 기다리기</li>
  <li>아래 버튼 누르기</li>
</ol>
<label for="url">Supabase URL</label>
<input id="url" value="https://cddcnnxhnyghueylasfv.supabase.co">
<label for="key">Supabase anon key</label>
<input id="key" value="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNkZGNubnhobnlnaHVleWxhc2Z2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkzMjQzMDAsImV4cCI6MjA5NDkwMDMwMH0.iTBzY1MxEWTZZKv4CDDy6mPWuGCDSLIA8ioyA_8Hyc0">
<button id="go">Supabase 에서 가져와서 옮기기</button>
<div id="log">대기 중…</div>
<script>
const log = (m) => { document.getElementById('log').textContent += '\n' + m; };
document.getElementById('go').onclick = async () => {
  const btn = document.getElementById('go');
  btn.disabled = true;
  document.getElementById('log').textContent = '시작합니다…';
  try {
    const url = document.getElementById('url').value.trim().replace(/\/$/, '');
    const key = document.getElementById('key').value.trim();
    const res = await fetch(url + '/rest/v1/restaurants?select=*&order=created_at.desc', {
      headers: { apikey: key, Authorization: 'Bearer ' + key }
    });
    if (!res.ok) throw new Error('Supabase 에서 읽기 실패 (HTTP ' + res.status + ') — 프로젝트가 복원됐는지 확인해주세요');
    const rows = await res.json();
    log('Supabase 에서 ' + rows.length + '개 읽음');
    if (!rows.length) { log('옮길 데이터가 없어요.'); return; }
    const r2 = await fetch('/api/import', {
      method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ rows })
    });
    const data = await r2.json().catch(() => ({}));
    if (!r2.ok) throw new Error(data.error || ('HTTP ' + r2.status));
    log('✅ ' + data.imported + '개 옮기기 완료! 이제 메인 페이지에서 확인해보세요.');
  } catch (e) {
    log('❌ ' + (e.message || e));
  } finally {
    btn.disabled = false;
  }
};
</script>
</body>
</html>
